# AI-Context-Core Configuration Defaults (context-only)

# Extra markdown docs embedded in the "MANUAL ARCHITECTURE NOTES" section.
# Globs are relative to the project root; extend per project or via --include-md.
context_docs = []

# Which AI_CONTEXT.md sections to render. Omit a name to skip that section.
# Available: structure, metrics, dependencies, git.
[context]
sections = ["structure", "metrics", "dependencies", "git"]

# Token budget for AI_CONTEXT.md. ``max_tokens`` caps the whole document
# (override per-run with ``ai-ctx context --max-tokens N``); ``[context.budget.sections]``
# adds per-section caps. Omit/uncomment to disable.
[context.budget]
# max_tokens = 8000
# [context.budget.sections]
# structure = 1500
# dependencies = 2500

# Analysis source selection. ``auto`` prefers external qgis-analyzer output
# (``analysis_results/project_context.json``) when present, else the builtin
# engine. ``external_path`` overrides the default output location.
[sources]
source = "auto"
# external_path = "analysis_results/project_context.json"

# Quality thresholds consumed by the optimization suggester (find_optimizations).
[quality_thresholds.complexity]
warning = 10
error = 15

[quality_thresholds.maintainability]
warning = 65
error = 50

[quality_thresholds.lines]
warning = 400
error = 800

# Internal quality_score heuristic (reported by `ai-ctx stats` / `analyze`).
# Additive adjustments applied to a 100-point base. Override per project
# through the [scoring] section in .ai-context/config.toml.
[scoring]
base_score = 100.0
complexity_medium_threshold = 15.0
complexity_medium_penalty_per_point = 2.0
complexity_high_threshold = 25.0
complexity_high_penalty_per_point = 0.5
complexity_high_penalty_cap = 10.0
maintainability_threshold = 65.0
maintainability_penalty_per_point = 1.5
no_tests_penalty = 20.0
tests_bonus_per_file = 2.0
tests_bonus_cap = 10.0

# Unused-import tuning. When true, package ``__init__.py`` modules are exempt
# from unused-import reporting because they typically re-export their public API.
[patterns.unused_imports]
ignore_package_reexports = true
