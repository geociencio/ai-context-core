name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Install uv
      uses: astral-sh/setup-uv@v5
      with:
        version: "latest"

    - name: Set up Python ${{ matrix.python-version }}
      run: uv python install ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        uv sync --all-extras --dev

    - name: Lint and format
      run: |
        uv run ruff check .
        uv run ruff format --check .

    - name: Run tests
      run: |
        uv run pytest tests/ -v --cov=src/ai_context_core --cov-report=term-missing

    - name: Verify committed context artifacts are fresh
      run: |
        uv run ai-ctx verify

    - name: Clean runtime install (no dev dependencies)
      if: matrix.python-version == '3.9'
      run: |
        uv venv .runtime-venv --python 3.9
        uv pip install --python .runtime-venv/bin/python .
        .runtime-venv/bin/python - <<'PY'
        from ai_context_core.analyzer.providers.config_loader import load_config

        config = load_config(None)
        assert config["context"]["budget"]["max_tokens"] == 8000
        assert config["sources"]["source"] == "auto"
        assert config["patterns"]["unused_imports"]["ignore_package_reexports"] is True
        print("runtime defaults OK on Python 3.9")
        PY
